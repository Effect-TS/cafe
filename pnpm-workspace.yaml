packages:
  - packages/*

# Mirrors ~/.bunfig.toml: only install versions published at least 3 days ago.
# Alchemy is exempt so new betas can be adopted the day they ship.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - effect
  - alchemy
  - "@alchemy.run/*"

catalog:
  "@alchemy.run/frontend-frameworks": 2.0.0-beta.81
  "@effect/platform-browser": 4.0.0
  "@effect/platform-bun": 4.0.0
  "@effect/platform-node": 4.0.0
  "@effect/vitest": 4.0.0
  "@foldkit/devtools": 0.165.0
  "@foldkit/devtools-mcp": 0.24.0
  "@foldkit/oxlint-plugin": 0.15.1
  "@foldkit/ui": 0.165.0
  "@foldkit/vite-plugin": 0.26.0
  "@tailwindcss/vite": ^4.3.3
  "@types/node": ^25.9.9
  alchemy: 2.0.0-beta.81
  effect: 4.0.0
  foldkit: 0.165.0
  happy-dom: ^20.14.5
  hono: ^4.13.12
  oxfmt: ^0.66.0
  oxlint: ^1.85.0
  playwright: 1.63.0
  tailwindcss: ^4.3.3
  termcut: 1.4.4
  typescript: ^7.0.2
  vite: ^8.3.1
  vitest: ^5.0.2

allowBuilds:
  esbuild: true
  workerd: true

# One hono for the whole workspace, so every package resolves the same
# @alchemy.run/frontend-frameworks peer set and therefore the same alchemy.
overrides:
  hono: "catalog:"
patchedDependencies:
  alchemy@2.0.0-beta.81: patches/alchemy@2.0.0-beta.81.patch
