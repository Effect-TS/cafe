name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  # pr-<number> for pull requests, prod for main, otherwise the branch name.
  STAGE: >-
    ${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.number)
      || (github.ref == 'refs/heads/main' && 'prod' || github.ref_name) }}

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit tests (Story + Scene)
        run: pnpm --filter @cafe/frontend test

  test:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Cloudflare credentials
        run: pnpm exec alchemy provider check-env --provider Cloudflare
      # Each PR's test stacks deploy to their own stage (test-pr-<number>)
      # and are destroyed by the suites when they finish.
      - name: Set test stage
        run: echo "ALCHEMY_TEST_STAGE=test-$STAGE" >> "$GITHUB_ENV"
      - name: Install Chromium
        run: pnpm --filter @cafe/frontend exec playwright install --with-deps chromium
      - name: API tests
        run: pnpm --filter @cafe/backend test
      - name: E2E tests
        run: pnpm --filter @cafe/frontend test:e2e

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PULL_REQUEST: ${{ github.event.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check credentials
        run: pnpm exec alchemy provider check-env --provider Cloudflare --provider GitHub
      - name: Deploy
        run: pnpm exec alchemy deploy --stage ${{ env.STAGE }} --yes

  demo:
    # Records the demo against this commit and uploads it to the public demos
    # bucket (stacks/github.ts): PRs embed theirs in the preview comment, and
    # main's is the one in the README.
    needs: deploy
    # tcut's browser pane records through WebKit, which macOS has built in.
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: brew install ffmpeg
      - run: pnpm install --frozen-lockfile
      - name: Check Cloudflare credentials
        run: pnpm exec alchemy provider check-env --provider Cloudflare
      # Stages for this PR's demo: the deploy it records, `alchemy dev`, and
      # the test suites. The demo destroys them when it finishes.
      - name: Set demo stages
        run: |
          echo "DEMO_STAGE=demo-$STAGE" >> "$GITHUB_ENV"
          echo "ALCHEMY_STAGE=dev-$STAGE" >> "$GITHUB_ENV"
          echo "ALCHEMY_TEST_STAGE=test-demo-$STAGE" >> "$GITHUB_ENV"
      - name: Record demo
        run: pnpm demo
      - name: Upload demo
        run: |
          prefix=${{ github.event_name == 'pull_request' && format('pr-{0}/{1}', github.event.number, github.event.pull_request.head.sha) || 'main' }}
          bun packages/demos/upload.ts "$prefix"
          echo "DEMO_URL=$DEMO_BASE_URL/$prefix" >> "$GITHUB_ENV"
        env:
          DEMO_BUCKET: ${{ vars.DEMO_BUCKET }}
          DEMO_BASE_URL: ${{ vars.DEMO_BASE_URL }}
      - name: Embed demo in the preview comment
        if: github.event_name == 'pull_request'
        run: pnpm exec alchemy deploy --stage ${{ env.STAGE }} --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.number }}

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PULL_REQUEST: ${{ github.event.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Safety check
        run: |
          if [ "${{ env.STAGE }}" = "prod" ]; then
            echo "ERROR: Cannot destroy prod environment in cleanup job"
            exit 1
          fi
      - name: Destroy preview
        run: pnpm exec alchemy destroy --stage ${{ env.STAGE }} --yes
      # Normally removed by the demo job itself; this catches interrupted runs.
      - name: Destroy demo stages
        run: |
          pnpm exec alchemy destroy --stage demo-${{ env.STAGE }} --yes
          pnpm exec alchemy destroy --stage dev-${{ env.STAGE }} --yes
